name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor the package claims and the newest release, on both platforms the author uses.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Formatting
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

      - name: Tests
        # The live dependency check is part of this suite, through StockTake's own plugin
        # (stocktake = true in pyproject.toml). It skips rather than fails when the registries
        # cannot be reached, and GITHUB_TOKEN raises the anonymous request limit.
        run: python -m pytest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show the dependency report
        # The plugin above already made this check pass or fail. This step exists to put the
        # full report in the log, which a test result cannot do. Served from the cache the
        # step above wrote, so it costs no extra requests.
        run: python -m stocktake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-scanning:
    name: Upload the findings to code scanning
    runs-on: ubuntu-latest
    # Only on a push to this repository: a pull request from a fork has no permission to write
    # security events, and failing CI for that would be a poor welcome to a contributor.
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

        # The dev extra matters here: this project's own dev dependencies are declared as ranges, so
        # without them installed there is nothing to resolve them against and they arrive in the
        # security tab as four `unpinned` notes about StockTake's own tooling. Which is correct, and
        # useless. The first run after this step was added did exactly that.
      - run: python -m pip install -e ".[dev]"

      - name: Produce the SARIF
        # Exit 1 means it found something unsafe, which is exactly what there is to upload.
        run: python -m stocktake --format sarif > stocktake.sarif || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: stocktake.sarif
          category: stocktake
